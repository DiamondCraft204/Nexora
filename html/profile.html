<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="judul.profil">Profil Saya — Nexora Market</title>
    <link rel="icon" href="../asset/nexora.ico?v=4" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../asset/nexora.svg?v=4">
    <link rel="icon" type="image/png" sizes="192x192" href="../asset/nexora.png?v=4">
    <link rel="apple-touch-icon" href="../asset/nexora.png?v=4">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <!-- Google Material Symbols: dipakai untuk seluruh ikon di situs ini (menggantikan emoji/stiker) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
</head>
<body data-butuh-login="true">

    <header class="header-utama">
        <div class="top-bar-nav">
            <div class="top-bar-kiri">
                <a href="#" data-i18n="nav.bantuan">Bantuan</a>
            </div>
            <div class="top-bar-kanan">
                <span id="greetingArea" class="user-greeting js-greeting-area" hidden></span>
                <a href="bagianDalam.html" data-i18n="nav.belanja">Belanja</a>
                <a href="profile.html" id="navProfile" class="active js-nav-profile"><span class="material-symbols-outlined" aria-hidden="true" translate="no">person</span><span data-i18n="nav.profil"> Profil</span></a>
                <button type="button" class="btn-toggle-lang" data-i18n-title="bahasa.judul" title="Ganti Bahasa">ID</button>
                <button type="button" class="btn-toggle-theme" data-i18n-title="tema.keGelap" title="Ganti Tema"></button>
            </div>
        </div>

        <div class="main-header-bar">
            <a href="bagianDalam.html" class="brand-logo-nexora">
                <span class="logo-icon"></span>
                <span data-i18n="nav.brandAkun">Nexora Market | Akun Saya</span>
            </a>
            <button type="button" id="btnMenuMobile" class="btn-hamburger" data-i18n-aria="nav.bukaMenu" aria-label="Buka menu"><span class="material-symbols-outlined" aria-hidden="true" translate="no">menu</span></button>
        </div>

        <nav id="menuMobileDropdown" class="menu-mobile-dropdown" hidden>
            <span class="user-greeting js-greeting-area" hidden></span>
            <a href="bagianDalam.html"><span class="material-symbols-outlined" aria-hidden="true" translate="no">home</span><span data-i18n="nav.beranda"> Beranda</span></a>
            <a href="profile.html" class="js-nav-profile" hidden><span class="material-symbols-outlined" aria-hidden="true" translate="no">person</span><span data-i18n="nav.profile"> Profile</span></a>
            <a href="keranjang.html"><span class="material-symbols-outlined" aria-hidden="true" translate="no">shopping_cart</span><span data-i18n="nav.keranjang"> Keranjang</span></a>
            <a href="layanan-pelanggan.html"><span class="material-symbols-outlined" aria-hidden="true" translate="no">help</span><span data-i18n="nav.bantuanPanduan"> Bantuan & Panduan</span></a>
            <a href="about.html"><span class="material-symbols-outlined" aria-hidden="true" translate="no">info</span><span data-i18n="nav.tentangKami"> Tentang Kami</span></a>
            <a href="login_daftar.html" class="js-nav-auth" data-i18n="nav.masukDaftar">Masuk / Daftar</a>
            <button type="button" class="btn-toggle-lang" data-i18n-title="bahasa.judul" title="Ganti Bahasa">ID</button>
        </nav>
    </header>

    <main class="utama">
        <button type="button" class="btn-kembali" onclick="window.history.back()"><span class="material-symbols-outlined" aria-hidden="true" translate="no">arrow_back</span><span class="btn-kembali-label" data-i18n="nav.kembali"> Kembali</span></button>
        <div class="profil-container-layout">

            <!-- Sidebar Navigasi Profil -->
            <aside class="profil-sidebar">
                <div class="profil-user-header">
                    <div class="avatar-icon-box"><span class="material-symbols-outlined" aria-hidden="true" translate="no">person</span></div>
                    <div>
                        <div class="profil-username" id="sidebarNamaUser" data-i18n="profil.pengguna">Pengguna</div>
                        <span class="profil-label-member" data-i18n="profil.member">Member Nexora</span>
                    </div>
                </div>

                <div class="profil-nav-menu">
                    <button type="button" class="btn-profil-tab active" id="tabAkunBtn">
                        <span class="material-symbols-outlined" aria-hidden="true" translate="no">settings</span><span data-i18n="profil.tabAkun"> Pengaturan Akun</span>
                    </button>
                    <button type="button" class="btn-profil-tab" id="tabPesananBtn">
                        <span class="material-symbols-outlined" aria-hidden="true" translate="no">inventory_2</span><span data-i18n="profil.tabPesanan"> Riwayat Pesanan</span>
                    </button>
                    <button type="button" class="btn-profil-logout" id="btnKeluarAkun">
                        <span class="material-symbols-outlined" aria-hidden="true" translate="no">logout</span><span data-i18n="profil.keluarAkun"> Keluar dari Akun</span>
                    </button>
                </div>
            </aside>

            <!-- Konten Tab -->
            <section class="profil-content-panel">

                <!-- TAB 1: PENGATURAN AKUN -->
                <div id="tabPengaturanAkun">
                    <h2 class="panel-header-title" data-i18n="profil.judulAkun">Pengaturan Akun</h2>
                    <form id="formProfile" class="form-profil">
                        <div class="grup-input-profil">
                            <label data-i18n="profil.lblNama">Nama Lengkap</label>
                            <input type="text" id="profNama" required disabled>
                        </div>

                        <div class="grup-input-profil">
                            <label data-i18n="profil.lblEmail">Email Akun (Terkunci)</label>
                            <input type="email" id="profEmail" readonly class="input-terkunci">
                        </div>

                        <div class="form-2kolom-profil">
                            <div class="grup-input-profil">
                                <label data-i18n="profil.lblUmur">Umur</label>
                                <input type="number" id="profUmur" required disabled>
                            </div>
                            <div class="grup-input-profil">
                                <label data-i18n="profil.lblTanggalLahir">Tanggal Lahir</label>
                                <input type="date" id="profTanggalLahir" required disabled>
                            </div>
                            <div class="grup-input-profil">
                                <label data-i18n="profil.lblGender">Jenis Kelamin</label>
                                <select id="profGender" required disabled>
                                    <option value="L" data-i18n="auth.genderL">Laki-laki</option>
                                    <option value="P" data-i18n="auth.genderP">Perempuan</option>
                                </select>
                            </div>
                        </div>

                        <div class="grup-input-profil">
                            <label data-i18n="profil.lblNoHp">Nomor Handphone</label>
                            <input type="tel" id="profNoHp" placeholder="08xxxxxxxxxx" disabled>
                        </div>

                        <div class="grup-input-profil">
                            <label data-i18n="profil.lblProvinsi">Provinsi</label>
                            <select id="profProvinsi" required disabled>
                                <option value="" disabled selected hidden data-i18n="bayar.phProvinsi">Pilih Provinsi</option>
                                    <option value="Aceh">Aceh</option>
                                    <option value="Sumatera Utara">Sumatera Utara</option>
                                    <option value="Sumatera Barat">Sumatera Barat</option>
                                    <option value="Riau">Riau</option>
                                    <option value="Kepulauan Riau">Kepulauan Riau</option>
                                    <option value="Jambi">Jambi</option>
                                    <option value="Sumatera Selatan">Sumatera Selatan</option>
                                    <option value="Kepulauan Bangka Belitung">Kepulauan Bangka Belitung</option>
                                    <option value="Bengkulu">Bengkulu</option>
                                    <option value="Lampung">Lampung</option>
                                    <option value="DKI Jakarta">DKI Jakarta</option>
                                    <option value="Jawa Barat">Jawa Barat</option>
                                    <option value="Jawa Tengah">Jawa Tengah</option>
                                    <option value="DI Yogyakarta">DI Yogyakarta</option>
                                    <option value="Jawa Timur">Jawa Timur</option>
                                    <option value="Banten">Banten</option>
                                    <option value="Bali">Bali</option>
                                    <option value="Nusa Tenggara Barat">Nusa Tenggara Barat</option>
                                    <option value="Nusa Tenggara Timur">Nusa Tenggara Timur</option>
                                    <option value="Kalimantan Barat">Kalimantan Barat</option>
                                    <option value="Kalimantan Tengah">Kalimantan Tengah</option>
                                    <option value="Kalimantan Selatan">Kalimantan Selatan</option>
                                    <option value="Kalimantan Timur">Kalimantan Timur</option>
                                    <option value="Kalimantan Utara">Kalimantan Utara</option>
                                    <option value="Sulawesi Utara">Sulawesi Utara</option>
                                    <option value="Sulawesi Tengah">Sulawesi Tengah</option>
                                    <option value="Sulawesi Selatan">Sulawesi Selatan</option>
                                    <option value="Sulawesi Tenggara">Sulawesi Tenggara</option>
                                    <option value="Gorontalo">Gorontalo</option>
                                    <option value="Sulawesi Barat">Sulawesi Barat</option>
                                    <option value="Maluku">Maluku</option>
                                    <option value="Maluku Utara">Maluku Utara</option>
                                    <option value="Papua">Papua</option>
                                    <option value="Papua Barat">Papua Barat</option>
                                    <option value="Papua Selatan">Papua Selatan</option>
                                    <option value="Papua Tengah">Papua Tengah</option>
                                    <option value="Papua Pegunungan">Papua Pegunungan</option>
                                    <option value="Papua Barat Daya">Papua Barat Daya</option>
                            </select>
                        </div>

                        <div class="form-2kolom-profil">
                            <div class="grup-input-profil">
                                <label data-i18n="profil.lblKota">Kota / Kabupaten</label>
                                <input type="text" id="profKota" data-i18n-ph="bayar.phKota" placeholder="Contoh: Kota Bandung" disabled>
                            </div>
                            <div class="grup-input-profil">
                                <label data-i18n="profil.lblKecamatan">Kecamatan</label>
                                <input type="text" id="profKecamatan" data-i18n-ph="bayar.phKecamatan" placeholder="Contoh: Coblong" disabled>
                            </div>
                            <div class="grup-input-profil">
                                <label data-i18n="profil.lblKodePos">Kode Pos</label>
                                <input type="text" id="profKodePos" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="40132" disabled>
                            </div>
                        </div>

                        <div class="grup-input-profil">
                            <label data-i18n="profil.lblAlamat">Alamat Utama (Detail)</label>
                            <textarea id="profAlamat" rows="3" data-i18n-ph="bayar.phDetailAlamat" placeholder="Nama jalan, gedung, No. rumah, RT/RW, patokan" disabled></textarea>
                        </div>

                        <button type="button" id="btnEditProfile" class="btn-edit-profil"><span class="material-symbols-outlined" aria-hidden="true" translate="no">edit</span><span data-i18n="profil.btnEdit"> Edit Profil</span></button>
                        <button type="submit" id="btnSimpanProfile" class="btn-simpan-profil" hidden><span class="material-symbols-outlined" aria-hidden="true" translate="no">save</span><span data-i18n="profil.btnSimpan"> Simpan Perubahan</span></button>
                    </form>
                </div>

                <!-- TAB 2: RIWAYAT PESANAN -->
                <div id="tabRiwayatPesanan" hidden>
                    <h2 class="panel-header-title" data-i18n="profil.judulPesanan">Pesanan Saya</h2>
                    <div id="wadahDaftarRiwayat" class="daftar-riwayat-wrapper"></div>
                    <nav class="pagination-produk" id="paginasiRiwayat" aria-label="Navigasi Halaman Riwayat"></nav>
                </div>

            </section>
        </div>
    </main>

    <footer class="kaki-marketplace">
        <div class="footer-bottom-copy" data-i18n="footer.hakCipta">
            &copy; 2026 Nexora Market. Hak Cipta Dilindungi Undang-Undang.
        </div>
    </footer>

    <!-- bahasa.js WAJIB dimuat sebelum script.js -->
    <script src="../js/bahasa.js"></script>
    <script src="../js/script.js"></script>
</body>
</html>
