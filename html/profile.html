<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya — NEXORA MARKET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-butuh-login="true">

  <!-- FLOATING NAVBAR -->
  <nav class="navbar-nexora">
    <a href="bagianDalam.html" class="brand-logo-nexora">NEXORA<span>.</span></a>
    
    <div class="nav-action-group">
        <button type="button" class="btn-toggle-theme" title="Ubah Tema">🌙</button>
      <a href="keranjang.html" class="tombol-keranjang" title="Keranjang Belanja">
        🛒 <span class="badge-keranjang" hidden>0</span>
      </a>
      <a href="bagianDalam.html" class="btn-dock-login">← Belanja</a>
    </div>
  </nav>

  <div class="profil-wrapper">
    <div class="profil-layout">
      
      <!-- SIDEBAR PROFIL -->
      <aside class="profil-sidebar">
        <div class="avatar-bulat">👤</div>
        <h3 id="sidebarNamaUser" style="font-size: 16px; font-weight: 700; margin-bottom: 4px;">Pengguna</h3>
        <span style="font-size: 12px; color: var(--text-secondary); margin-bottom: 16px;">Nexora Member</span>

        <div class="tab-nav-profil">
          <button type="button" id="tabAkunBtn" class="tab-profil-btn active">⚙️ Pengaturan Akun</button>
          <button type="button" id="tabPesananBtn" class="tab-profil-btn">📦 Riwayat Pesanan</button>
        </div>

        <button type="button" id="btnKeluarAkun" style="margin-top: 32px; width: 100%; border: none; background: #fee2e2; color: var(--danger); font-weight: 700; font-size: 12px; padding: 10px; border-radius: var(--radius-pill); cursor: pointer;">
          🚪 Keluar Akun
        </button>
      </aside>

      <!-- KONTEN AREA TAB -->
      <main class="profil-konten-area">
        
        <!-- TAB 1: PENGATURAN AKUN -->
        <div id="tabPengaturanAkun">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px;">
            <div>
              <h2 style="font-size: 18px; font-weight: 800;">Informasi Pribadi</h2>
              <p style="font-size: 12px; color: var(--text-secondary);">Kelola informasi profil untuk mempermudah transaksi pengiriman.</p>
            </div>
            <button type="button" id="btnEditProfile" style="border: 1px solid var(--text-primary); background: transparent; color: var(--text-primary); font-weight: 700; font-size: 12px; padding: 6px 16px; border-radius: var(--radius-pill); cursor: pointer;">
              ✏️ Edit Profil
            </button>
          </div>

          <form id="formProfile" autocomplete="off">
            <div class="form-grup">
              <label for="profNama">Nama Lengkap</label>
              <input type="text" id="profNama" disabled required>
            </div>

            <div class="form-grup">
              <label for="profEmail">Alamat Email</label>
              <input type="email" id="profEmail" disabled readonly>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div class="form-grup">
                <label for="profTanggalLahir">Tanggal Lahir</label>
                <input type="date" id="profTanggalLahir" disabled required>
              </div>
              <div class="form-grup">
                <label for="profUmur">Usia (Tahun)</label>
                <input type="number" id="profUmur" disabled readonly required>
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
              <div class="form-grup">
                <label for="profGender">Jenis Kelamin</label>
                <select id="profGender" disabled required>
                  <option value="Laki-laki">Laki-laki</option>
                  <option value="Perempuan">Perempuan</option>
                </select>
              </div>
              <div class="form-grup">
                <label for="profNoHp">Nomor Telepon / WhatsApp</label>
                <input type="tel" id="profNoHp" placeholder="08xxxxxxxxxx" disabled>
              </div>
            </div>

            <div class="form-grup">
              <label for="profAlamat">Alamat Pengiriman</label>
              <textarea id="profAlamat" rows="3" placeholder="Masukkan alamat lengkap rumah/kantor..." disabled></textarea>
            </div>

            <button type="submit" id="btnSimpanProfile" class="btn-auth-submit" hidden>
              Simpan Perubahan
            </button>
          </form>
        </div>

        <!-- TAB 2: RIWAYAT PESANAN -->
        <div id="tabRiwayatPesanan" hidden>
          <h2 style="font-size: 18px; font-weight: 800; margin-bottom: 6px;">Riwayat Pesanan</h2>
          <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 20px;">Daftar seluruh transaksi yang telah berhasil Anda selesaikan.</p>
          
          <div id="wadahDaftarRiwayat"></div>
        </div>

      </main>

    </div>
  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script src="../js/script.js"></script>
</body>
</html>
